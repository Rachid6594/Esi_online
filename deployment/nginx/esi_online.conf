# Nginx pour ESI-Online sur un VPS unique.
#
# Rôle : servir la fichiers statiques et les médias directement depuis le
# disque, et ne passer à Django que ce qui est du calcul. Les documents déposés
# ne repassent donc jamais par gunicorn, ce qui compte quand un cours fait
# 80 Mo.
#
# Installation :
#   sudo cp deployment/nginx/esi_online.conf /etc/nginx/sites-available/esi_online
#   sudo ln -s /etc/nginx/sites-available/esi_online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Les chemins ci-dessous correspondent à deployment/systemd/esi-online.service.
# Si vous changez MEDIA_ROOT, changez-le ici aussi.

upstream esi_online_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirection vers HTTPS. À commented jusqu'à ce que le certificat soit
    # installé, sinon le site devient injoignable.
    # return 301 https://$host$request_uri;

    # Un dépôt admin accepte jusqu'à 100 Mo. Si vous durcissez cette limite
    # côté Django, alignez-la ici : nginx renvoie 413 avant que Django ne
    # lise le corps de la requête.
    client_max_body_size 110M;

    # Compression des réponses texte. Les PDF sont déjà compressés par leur
    # nature : inutile de les repasser au gzip, ce qui coûterait du CPU pour
    # rien. gzip_vary casse le cache pour les navigateurs plus anciens.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # ------------------------------------------------------------------
    # Médias : servis par nginx, jamais par Django
    # ------------------------------------------------------------------
    location /media/ {
        alias /srv/esi-online/media/;
        # add_header Accept-Ranges bytes;  # laisse nginx gérer les reprises
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        # Les documents déposés par l'administration ne doivent pas être
        # exécutés s'ils sont malgré tout téléchargés puis ouverts.
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Fichiers statiques compilés par le front
    # ------------------------------------------------------------------
    location /static/ {
        alias /srv/esi-online/backend/esi_online/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Les fichiers du front sont servis par Django ou par un reverse distinct.
    # Si le build Vite est déposé à la racine du site, décommentez ce bloc :
    # location /assets/ {
    #     alias /srv/esi-online/frontend/dist/assets/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }

    # ------------------------------------------------------------------
    # API et admin : tout le reste va à Django
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://esi_online_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un dépôt multipart est lent sur une liaison longue : sans ça,
        # nginx coupe la requête à 60 s et l'admin voit un échec sans motif.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Django UploadedFile est déjà en mémoire ou en temporaire, donc on ne
        # fait pas bodily la requête en mémoire de gunicorn.
        proxy_request_buffering off;
    }
}