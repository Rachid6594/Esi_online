# Nginx pour ESI-Online sur un VPS unique.
#
# Rôle : servir la SPA Vite (frontend/dist), les fichiers statiques et les
# médias directement depuis le disque, et ne passer à Django que ce qui est du
# calcul. Les documents déposés ne repassent donc jamais par gunicorn, ce qui
# compte quand un cours fait 80 Mo.
#
# Installation :
#   sudo cp deployment/nginx/esi_online.conf /etc/nginx/sites-available/esi_online
#   sudo ln -s /etc/nginx/sites-available/esi_online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Les chemins ci-dessous correspondent à deployment/systemd/esi-online.service.
# Si vous changez MEDIA_ROOT ou le dossier du build front, changez-les ici aussi.
#
# La SPA utilise /admin (espace administrateur publié). Le site Django a donc
# été déplacé sous /django-admin/ (backend/esi_online/esi_online/urls.py).

upstream esi_online_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    # Renseigner le vrai nom de domaine ici (ALLOWED_HOSTS doit le contenir
    # côté Django).
    server_name _;

    # Redirection vers HTTPS. À commented jusqu'à ce que le certificat soit
    # installé, sinon le site devient injoignable.
    # return 301 https://$host$request_uri;

    # Un dépôt admin accepte jusqu'à 100 Mo. Si vous durcissez cette limite
    # côté Django, alignez-la ici : nginx renvoie 413 avant que Django ne
    # lise le corps de la requête.
    client_max_body_size 110M;

    # Compression des réponses texte. Les PDF sont déjà compressés par leur
    # nature : inutile de les repasser au gzip, ce qui coûterait du CPU pour
    # rien. gzip_vary casse le cache pour les navigateurs plus anciens.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # ------------------------------------------------------------------
    # Médias : servis par nginx, jamais par Django
    # ------------------------------------------------------------------
    location /media/ {
        alias /srv/esi-online/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        # Les documents déposés par l'administration ne doivent pas être
        # exécutés s'ils sont malgré tout téléchargés puis ouverts : on
        # force la pièce jointe pour tous les types sauf les affichables.
        # Un PDF reste ainsi prévisualisable (Aperçu dans l'espace admin) ;
        # les archives, HTML ou scripts sont toujours téléchargés.
        location ~* \.(pdf|png|jpe?g|gif|svg|webp|avif|mp4|webm)$ {
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff";
        }
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Fichiers statiques Django (admin, docs)
    # ------------------------------------------------------------------
    location /static/ {
        alias /srv/esi-online/backend/esi_online/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ------------------------------------------------------------------
    # API et site Django : tout ce qui est du calcul va à gunicorn
    # ------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://esi_online_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un dépôt multipart est lent sur une liaison longue : sans ça,
        # nginx coupe la requête à 60 s et l'admin voit un échec sans motif.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Django UploadedFile est déjà en mémoire ou en temporaire, donc on ne
        # fait pas bodily la requête en mémoire de gunicorn.
        proxy_request_buffering off;
    }

    location ^~ /django-admin/ {
        proxy_pass http://esi_online_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # SPA React (build Vite) : le fallback index.html fait tourner le
    # routage du client pour /admin, /home, etc.
    # ------------------------------------------------------------------
    location / {
        root /srv/esi-online/frontend/dist;
        try_files $uri $uri/ /index.html;

        # Les fichiers hachés par Vite (/assets/*) sont immuables : cache long.
        location /assets/ {
            alias /srv/esi-online/frontend/dist/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache";
        }
    }
}