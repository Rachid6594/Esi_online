name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vite exige ^20.19 ou >=22.12, vitest exige ^22.12 ou ^24 : on
        # couvre les deux bornes de la plage maintenue
        node: ['22.12', '24']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: esi_test
          POSTGRES_USER: esi
          POSTGRES_PASSWORD: esi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_ENGINE: postgresql
      DB_NAME: esi_test
      DB_USER: esi
      DB_PASSWORD: esi
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: 'false'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verification de la configuration Django
        run: python esi_online/manage.py check

      - name: Tests
        # Le label "app" est indispensable : sans argument, la decouverte part
        # du dossier courant et n entre pas dans esi_online/, qui n a pas de
        # __init__.py, donc 0 test est decouvert et la commande reussit quand
        # meme. Le garde-fou plus bas detecte ce cas.
        run: |
          set -o pipefail
          python esi_online/manage.py test app 2>&1 | tee backend-test.log
          if grep -q "Ran 0 tests" backend-test.log; then
            echo "::error::aucun test backend n'a ete execute"
            exit 1
          fi

      - name: Schema OpenAPI a jour
        run: |
          python esi_online/manage.py spectacular --file /tmp/schema.yaml
          # on verifie que le fichier versionne correspond a ce que le code
          # produit aujourd'hui, sinon la documentation ment
          diff -u esi_online/openapi-schema.yaml /tmp/schema.yaml
